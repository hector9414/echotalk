<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EchoTalk</title>
    <link rel="stylesheet" href="listen.css" />
  </head>
  <body>
    <main>
      <section id="join-screen">
        <h1>EchoTalk</h1>
        <p>Vas a escuchar la traducción en vivo de esta charla, con subtítulos y audio.</p>
        <label class="language-label" for="my-language">
          Tu idioma (por si quieres preguntar con tu micrófono)
          <select id="my-language"></select>
        </label>
        <button id="join-button" type="button">Unirme</button>
      </section>

      <section id="listen-screen" hidden>
        <p id="session-status" class="status" role="status">
          <span id="live-badge" class="live-badge" hidden><span class="live-dot"></span>EN VIVO</span>
          <span id="session-status-text">Conectando...</span>
        </p>
        <div id="captions" class="captions"></div>
        <button id="resume-audio" type="button" hidden>Toca para escuchar</button>
        <audio id="player" playsinline></audio>

        <div id="question-panel" class="question-panel">
          <button id="ask-button" type="button">🎤 Preguntar</button>
          <button id="end-question-button" type="button" hidden>Terminar pregunta</button>
          <p id="question-status" class="question-status" role="status"></p>
        </div>
      </section>
    </main>
    <script src="listen.js"></script>
  </body>
</html>
